repos:
  - repo: local
    hooks:
      - id: no-home-paths
        name: No absolute home-directory paths
        language: pygrep
        entry: '(/[h]ome/[^/]+/|C:\\[U]sers\\[^\\]+\\)'
        exclude: '^(.*\.md|openspec/).*'
      - id: gdlint
        name: GDScript lint
        language: system
        entry: gdlint
        files: \.(gd)$
        types: [file]
