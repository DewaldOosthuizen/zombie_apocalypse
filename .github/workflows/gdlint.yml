name: GDScript Lint

on: [push, pull_request]

jobs:
  gdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gdtoolkit
        run: pip install gdtoolkit
      - name: GDScript lint
        run: gdlint scripts/
