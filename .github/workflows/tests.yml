name: GUT Tests

# Automated push/pull_request triggers have been removed intentionally.
# Running Godot headless on GitHub Actions is slow and resource-intensive;
# contributors should run tests locally using scripts/download_gut.sh and
# scripts/run_gut_tests.sh before merging.  The job can still be triggered
# manually via the Actions tab (workflow_dispatch) when a CI run is needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-4.6-stable

      - name: Install Godot 4
        run: |
          if [ ! -f /usr/local/bin/godot ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
            unzip -q Godot_v4.6-stable_linux.x86_64.zip
            sudo mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
            chmod +x /usr/local/bin/godot
          fi

      - name: Import project assets
        # Godot 4 headless --editor --quit does not guarantee exit 0 on success;
        # '; true' explicitly allows a non-zero exit without silencing real failures.
        run: godot --headless --editor --quit; true

      - name: Run GUT tests headlessly
        run: |
          godot --headless -s addons/gut/addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -gprefix=test_ \
            -gsuffix=.gd \
            -gexit
