name: GUT Tests

# Disabled: GUT tests exceed 1 hour on GitHub Actions (Godot headless
# startup + GUT initialisation is too slow for CI). Run locally with
# scripts/run_gut_tests.sh instead. Kept as workflow_dispatch so it
# can still be triggered manually from the GitHub Actions UI if needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-4.6-stable

      - name: Install Godot 4
        run: |
          if [ ! -f /usr/local/bin/godot ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
            unzip -q Godot_v4.6-stable_linux.x86_64.zip
            sudo mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
            chmod +x /usr/local/bin/godot
          fi

      - name: Import project assets
        run: godot --headless --editor --quit || true

      - name: Run GUT tests headlessly
        run: |
          godot --headless -s addons/gut/addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -gprefix=test_ \
            -gsuffix=.gd \
            -gexit
